services:
  backend:
    container_name: backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 3000:3000
    env_file:
      - ./backend/.env 
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mysql
    networks:
      - network-software2
  
  #Add new containers

  frontend-software2:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - 4200:4200
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on: #New nest projects
      - backend
    networks:
      - network-software2

  mysql:
    container_name: mysql
    image: mysql:8.4.4
    ports:
      - "3307:3306"
    env_file:
      - ./backend/.env  
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - network-software2

volumes:
  mysql_data:

networks:
  network-software2: