<form [formGroup]="reserveForm" (ngSubmit)="onSubmit()" class="reserva-container">
  <h2>Reserva de Hotel</h2>

  <div class="form-section">
    <div class="form-group">
      <label>Fechas de estadía</label>
      <div class="date-fields">
        <input type="date" formControlName="fechaEntrada" [min]="reserveForm.get('fechaEntrada')?.value || hoy">
        <input type="date" formControlName="fechaSalida" [min]="reserveForm.get('fechaSalida')?.value || hoy">
      </div>
      <div class="errors">
        <span *ngIf="reservaForm.get('fechaEntrada')?.hasError('required') && reservaForm.get('fechaEntrada')?.touched">
          Fecha requerida
        </span>
      </div>
    </div>

    <div class="form-group">
      <label>Datos personales</label>
      <input type="text" formControlName="nombre" placeholder="Nombre completo">
      <input type="email" formControlName="email" placeholder="Correo electrónico">
      <input type="tel" formControlName="telefono" placeholder="Teléfono (opcional)">
      
      <div class="errors">
        <div *ngIf="reservaForm.get('nombre')?.hasError('required') && reservaForm.get('nombre')?.touched">
          Nombre requerido
        </div>
        <div *ngIf="reservaForm.get('email')?.hasError('email') && reservaForm.get('email')?.touched">
          Correo electrónico inválido
        </div>
        <div *ngIf="reservaForm.get('telefono')?.hasError('pattern')">
          Formato: 10 dígitos
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Habitaciones</label>
      <input type="number" formControlName="habitaciones" min="1">
    </div>

    <div class="form-group">
      <label>Método de pago</label>
      <select formControlName="metodoPago">
        <option value="tarjeta">Tarjeta de crédito</option>
        <option value="paypal">PayPal</option>
        <option value="transferencia">Transferencia</option>
      </select>
    </div>

    <button type="submit" [disabled]="reserveForm.invalid" class="submit-btn">
      Confirmar Reserva
    </button>
  </div>
</form>
