<div class="container-register">  
    <div class="title">
        <h1>Sign-in</h1>
    </div>

    <div class="input-group mb-3">
        <input 
        type="text"
        class="form-control"
        placeholder="Nombre"
        [(ngModel)]="firstName"
        name="nombre"
        required>
    </div>

    <div class="input-group mb-3">
        <input 
        type="text"
        class="form-control"
        placeholder="Apellido"
        [(ngModel)]="lastName"
        name="apellido"
        required>
    </div>

    <div class="input-group mb-3">
      <input 
      type="text"
      class="form-control"
      placeholder="Username"
      [(ngModel)]="username"
      name="username"
      required>
    </div>
  
    <div class="mb-3">
    <input 
      type="password"
      class="form-control"
      placeholder="Contraseña"
      [(ngModel)]="password"
      name="contraseña"
      required>
    </div>
  
    <div class="input-group mb-3">
      <input 
      type="email"
      class="form-control"
      placeholder="Correo"
      [(ngModel)]="email"
      name="correo"
      required>
    </div>

    <div class="input-group mb-3">
        <input 
        type="text"
        class="form-control"
        placeholder="Celular"
        [(ngModel)]="phone"
        name="celular"
        required>
    </div>
  
    <!-- Botón para enviar los datos -->
    <div class="button-sign">
      <button (click)="registerUser()">Sign</button>
    </div>  
  </div>
